  --radius-sm: 10px;
  --font: "Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --transition: .3s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {

  --surface: rgba(30,41,59,.78);

}

/* ═══════════════ 重置 ═══════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {

  background: var(--bg);
  color: var(--fg);
  transition: background var(--transition), color var(--transition);
}

}
body::after {

  bottom: -30%; left: -15%;

  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--g-to) 10%, transparent) 0%, transparent 70%);

  z-index: 0;
}

# 论文研究图谱

## 一、论文的起点：推荐是重复可见性分配 <!-- markmap: fold -->
### 为什么必须改写对象
- 推荐系统控制的是请求级列表分配，不是社交关系本身
- 审计者真正能观察的是时间窗口内累积形成的曝光图
- 研究对象是**曝光结构**，不是态度极化结果
### 三层对象声明
- 行动层：请求 `r`、候选集 `C_r`、推荐列表 `a_r`
- 审计层：动态曝光图 `G_t = (U, E_t, f_t)`
- 诊断层：`G_t` 上的三元组结构条件
### 论文主动不做什么
- 不把结构风险直接等同于 echo chamber 本体
- 不把风险分数直接外推为福利或态度改善
- 不把日志代理包装成真实线上随机实验

## 二、四个研究缺口 <!-- markmap: fold -->
### 缺口 1：缺少结构性曝光诊断工具
- 二元层审计难以捕捉局部方向性闭合与回流
- 高阶结构信号在推荐曝光图中仍未被系统引入
### 缺口 2：固定权重公式不稳
- 手工指数容易被活跃度计数这类强基线匹配或超过
- 风险诊断必须转向数据驱动和校准化
### 缺口 3：用户聚合代理脱离列表级现实
- 真实系统在请求-候选集-列表层运作
- 只看用户聚合层会丢失位置偏差和列表组成效应
### 缺口 4：干预和评估容易自指
- 若重排序器仅最小化自身输出，就难以证明结构信号的独立价值
- 诊断目标、评估指标和干预动作必须拆开

## 三、三组件框架 <!-- markmap: fold -->
### TSFB：三元组结构特征库
- 核心结构层 + 背景控制层
- 核心层覆盖四类机制：`C / I / P / A`
- 控制层吸收活跃度、体量、熵、度不对称、列表上下文
### TSHM：多任务校准风险模型
- 目标是结构性、分布性、复合性三类负面分配事件
- 预测目标在公式上独立于输入特征
- 单调约束 + ECE 校准 + 共享过程依赖透明报告
### SECR：结构性外部性约束重排序
- 在列表级别联合优化效用 `U`、公平 `F`、结构风险 `S`
- 位置贪心 + 局部增量风险近似 + 邻域截断 `L`
- 是可审计干预原型，不是福利最优器

## 四、四个机制对齐特征 <!-- markmap: fold -->
### `C`：方向性循环
- 机制：拓扑旋度 / 非势流闭合
- 作用：识别二元分析不可见的局部环流
- 理论锚点：Hodge 分解的旋度分量
### `I`：跨群体隔离
- 机制：边界混合 / 隔离
- 作用：衡量三元组边界上的内群体边比例
- 只在标签明确时启用
### `P`：时间持续性
- 机制：跨窗口复现
- 作用：区分持续锁定与一次性扰动
- 方向不强行约束，交由数据决定
### `A`：放大集中
- 机制：边权重集中 / 单向主导
- 作用：检测是否由少数边持续吸走曝光
- 与公平问题直接相连

## 五、方法链路如何闭环 <!-- markmap: fold -->
### 第一步：从列表诱导曝光图
- 每次请求产生位置加权曝光 `e_(r,k)`
- 窗口内累计为 `f_t(e)`，构成动态曝光图
- 单个列表是行动对象，曝光图是审计对象
### 第二步：从曝光图提取三元组结构
- 三元组是能同时容纳共同暴露、方向性和局部闭环的最小单元
- `f_t^(q)(e)` 用反向边差异的符号编码不对称
- TSFB 输出核心结构信号与控制变量
### 第三步：把结构条件映射成风险
- TSHM 输出 `p^(1) / p^(2) / p^(3)` 三项任务风险
- 聚合风险 `p^agg` 只作为默认操作化入口
- 风险信号服务于审计触发，而不是最终因果判断
### 第四步：回到列表级重排序
- SECR 在候选集中逐位置选择项目
- 每一步同时考虑效用、公平、局部增量风险
- 图级结构条件由列表级动作被操作化

## 六、理论性质与解释边界 <!-- markmap: fold -->
### 命题 1：旋度-势流可分
- 三元组局部旋度与梯度势流正交
- 高阶层揭示二元分析不可见的信息盲区
### 命题 2：受限条件下的贪心合理性
- 当效用可分、`L = 1` 且使用局部近似时
- 位置贪心有条件性的启发式保证
- 不是对所有配置的一般最优性证明
### 命题 3：审计范围边界
- 结构条件诊断停留在 `G_t -> 三元组条件` 这一段
- 不向态度、行为或福利结果做直接推断
- 这是设计支柱，不是未声明的局限

## 七、评估协议与失败判据 <!-- markmap: fold -->
### 三层证据架构
- 第一层：MIND / FINN.no Slates / KuaiRand
- 第二层：四类失配压力测试
- 第三层：历史重放与方向一致性参考
### 诊断指标
- ROC AUC / PR AUC / Brier / ECE
- 特征消融 `ΔAUC`
- 互信息分解：核心层 vs 控制层
### 策略指标
- NDCG@K
- 提供者公平差距 / 用户公平差距
- 覆盖率、多样性、结构风险降幅
- 与基线排名的策略距离
### 失败判据
- TSHM 不能显著超过 ActivityCount
- 移除核心特征后性能几乎不变
- SECR 以超过 15% 的 NDCG 损失换取风险下降
- 校准后任一任务 `ECE > 0.10`

## 八、当前手稿的最稳定位 <!-- markmap: fold -->
### 可以成立的说法
- 一篇对象定义清楚、机制链完整的方法稿
- 卖点是“诊断先于治理”的中间层框架
- 亮点在对象重写、风险校准、结构性外部性约束
### 不能越界的说法
- 不能写成真实平台随机实验稿
- 不能写成全面优于所有强基线
- 不能写成风险下降自动带来态度改善
### 结尾口径
- 论文提供的是推荐曝光网络上的结构风险诊断与结构保持治理原型
- 它把对象层、方法层、证据层和解释边界一起写清了
- 图表与实验结果更新后再补数值，不提前预支结论

<script>
(() => {
  /* ── 等待 markmap 渲染完成 ── */
  const waitForMM = (cb, tries = 0) => {
    /* autoloader 在 .markmap 的子 SVG 上挂载实例 */
    const el = document.querySelector('.markmap');
    const svg = el && el.querySelector('svg');
    const mm = svg && (svg.markmap || svg.__markmap__);
    /* 也检查全局 */
    const mmGlobal = window.markmap;
    if (mm && mm.state && mm.state.data) {
      cb(mm, svg); return;
    }
    /* 备选：检查 SVG 是否已有子元素（渲染完成标志） */
    if (svg && svg.querySelector('g') && svg.querySelector('g').children.length > 2) {
      /* 无直接实例引用，用轮询 DOM 操作替代 */
      cb(null, svg); return;
    }
    if (tries < 100) setTimeout(() => waitForMM(cb, tries + 1), 200);
  };

  waitForMM((mm, svg) => {
    if (!mm) {
      /* 没有获取到实例引用，按钮暂不绑定 */
      console.log('Markmap rendered but instance not accessible');
      return;
    }

    /* ── 统计 ── */
    let nc = 0, md = 0;
    const walk = (n, d) => { nc++; if (d > md) md = d; (n.children||[]).forEach(c => walk(c, d+1)); };
    if (mm.state && mm.state.data) walk(mm.state.data, 0);
    document.getElementById('sNodes').textContent = nc + ' 节点';
    document.getElementById('sDepth').textContent = md + ' 层';

    /* ── 克隆树 + 遍历 ── */
    const cloneTree = (n) => ({ ...n, payload: n.payload ? { ...n.payload } : {}, children: (n.children||[]).map(cloneTree) });
    const walkSet = (n, d, fn) => { fn(n, d); (n.children||[]).forEach(c => walkSet(c, d+1, fn)); };

    /* ── 展开/收起 ── */
    document.getElementById('btnExpand').addEventListener('click', async () => {
      const r = cloneTree(mm.state.data);
      walkSet(r, 0, (n) => { n.payload = { ...(n.payload||{}), fold: 0 }; });
      await mm.setData(r); await mm.fit();
    });
    document.getElementById('btnCollapse').addEventListener('click', async () => {
      const r = cloneTree(mm.state.data);
      walkSet(r, 0, (n, d) => { n.payload = { ...(n.payload||{}), fold: d >= 2 ? 1 : 0 }; });
      await mm.setData(r); await mm.fit();
    });

    /* ── 缩放 ── */
    document.getElementById('btnZoomIn').addEventListener('click', () => {
      mm.rescale(1.25);
    });
    document.getElementById('btnZoomOut').addEventListener('click', () => {
      mm.rescale(0.8);
    });
    document.getElementById('btnFit').addEventListener('click', () => {
      mm.fit();
    });

    /* ── 搜索 ── */
    let timer;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        const q = e.target.value.trim().toLowerCase();
        svg.querySelectorAll('text').forEach(t => {
          const match = q && t.textContent.toLowerCase().includes(q);
          t.style.fill = match ? 'var(--g-from)' : '';
          t.style.fontWeight = match ? '800' : '';
          t.style.fontSize = match ? '1.1em' : '';
        });
      }, 200);
    });
  });

  /* ── 深色模式 ── */
  const apply = (dark) => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.getElementById('iconSun').style.display = dark ? 'block' : 'none';
    document.getElementById('iconMoon').style.display = dark ? 'none' : 'block';
    localStorage.setItem('mm-theme', dark ? 'dark' : 'light');
  };
  const saved = localStorage.getItem('mm-theme');
  apply(saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme:dark)').matches));
  document.getElementById('btnDark').addEventListener('click', () => {
    apply(document.documentElement.getAttribute('data-theme') !== 'dark');
  });

  /* ── 全屏 ── */
  document.getElementById('btnFS').addEventListener('click', () => {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  });
})();
</script>
</body>
</html>
